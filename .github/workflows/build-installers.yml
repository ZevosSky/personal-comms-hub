name: Build Installers

on:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write (it creates the GitHub Release).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  smoke:
    name: Smoke Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux
          - os: windows-latest
            label: Windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download native Electron test runtime
        run: node node_modules/electron/install.js

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-x11 dunst openbox wmctrl xvfb xauth x11-utils libasound2t64 libgbm1 libgtk-3-0t64 libnotify4 libnss3 libxss1

      - name: Configure Linux Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Run smoke checks
        run: npm run smoke

      - name: Run Electron integration checks (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron

      - name: Run Electron integration checks (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/run-linux-desktop-tests.sh npm run test:electron

  build:
    name: Build ${{ matrix.label }}
    needs: smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            package_command: npx electron-builder --win nsis --x64 --publish never
            artifact_glob: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-24.04
            label: Linux
            package_command: npx electron-builder --linux deb rpm tar.gz --x64 --publish never
            artifact_glob: |
              release/*.deb
              release/*.rpm
              release/*.tar.gz
              release/latest-linux.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Installed copies compare the release tag with their own version, so a tag that does not
      # match package.json would make every user see "update available" forever.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "const v = 'v' + require('./package.json').version; if (v !== process.env.GITHUB_REF_NAME) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ' + v); process.exit(1); }"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-x11 dunst openbox wmctrl xvfb xauth x11-utils libasound2t64 libgbm1 libgtk-3-0t64 libnotify4 libnss3 libxss1 rpm

      - name: Build renderer
        run: npm run build

      - name: Package installer
        run: ${{ matrix.package_command }}

      - name: Configure packaged Linux Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox

      - name: Verify packaged Linux startup
        if: runner.os == 'Linux'
        run: sh scripts/run-linux-desktop-tests.sh npm run test:packaged

      - name: Install Debian package and verify desktop integration
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends -y ./release/*.deb
          test -x '/opt/Comms Hub/comms-app'
          test "$(stat -c '%U:%G' '/opt/Comms Hub/chrome-sandbox')" = root:root
          grep -Fx 'StartupWMClass=com.garyyang.commshub' /usr/share/applications/com.garyyang.commshub.desktop

      - name: Verify installed Linux startup
        if: runner.os == 'Linux'
        run: sh scripts/run-linux-desktop-tests.sh npm run test:packaged -- '/opt/Comms Hub/comms-app'

      - name: Verify RPM sandbox and desktop integration
        if: runner.os == 'Linux'
        run: |
          for package in release/*.rpm; do
            rpm -qp --queryformat '[%{FILENAMES}|%{FILEUSERNAME}|%{FILEGROUPNAME}\n]' "$package" | grep -Fx '/opt/Comms Hub/chrome-sandbox|root|root'
            rpm -qpl "$package" | grep -Fx /usr/share/applications/com.garyyang.commshub.desktop
            rpm -qp --scripts "$package" | grep -F "chmod 4755 '/opt/Comms Hub/chrome-sandbox'"
          done

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comms-hub-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: comms-hub-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        # Third-party action pinned to a commit (v2.6.2) because this job holds a write token.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: Comms Hub ${{ github.ref_name }}
          body: |
            Download the package for your system:

            - Windows: `Comms Hub Setup <version>.exe`
            - Ubuntu/Debian: `comms-app_<version>_amd64.deb`
            - Fedora: `comms-app-<version>.x86_64.rpm`
            - Linux fallback: `comms-app-<version>.tar.gz`

            Other files:

            - `*.blockmap` and `*.yml` are update metadata files
            - `Source code` archives are the raw repository snapshot, not desktop installers
          files: |
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.tar.gz
          generate_release_notes: true
