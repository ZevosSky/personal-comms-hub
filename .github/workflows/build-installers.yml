name: Build Installers

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write (it creates the GitHub Release).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  smoke:
    name: Smoke Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-latest
            label: Windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke checks
        run: npm run smoke

      - name: Run Electron integration checks (Windows)
        if: runner.os == 'Windows'
        run: npm run test:electron

  build:
    name: Build ${{ matrix.label }}
    needs: smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            package_command: npx electron-builder --win nsis --x64 --publish never
            artifact_glob: |
              release/*.exe
              release/*.blockmap
              release/latest.yml

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Installed copies compare the release tag with their own version, so a tag that does not
      # match package.json would make every user see "update available" forever.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "const v = 'v' + require('./package.json').version; if (v !== process.env.GITHUB_REF_NAME) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ' + v); process.exit(1); }"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Package installer
        run: ${{ matrix.package_command }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comms-hub-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: comms-hub-*
          path: release-assets
          merge-multiple: true

      - name: Publish release
        # Third-party action pinned to a commit (v2.6.2) because this job holds a write token.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: Comms Hub ${{ github.ref_name }}
          body: |
            Download the Windows installer:

            - Windows: `Comms Hub Setup <version>.exe`
            - Linux packages are temporarily disabled while Linux support is being repaired.

            Other files:

            - `*.blockmap` and `*.yml` are update metadata files
            - `Source code` archives are the raw repository snapshot, not desktop installers
          files: |
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
          generate_release_notes: true
