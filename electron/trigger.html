<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
    <title>Comms Hub Dock Trigger</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      button {
        appearance: none;
        display: block;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 1px solid rgba(226, 232, 240, 0.08);
        background: linear-gradient(180deg, rgba(226, 232, 240, 0.065), rgba(148, 163, 184, 0.025));
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.04);
        backdrop-filter: blur(16px) saturate(135%);
        cursor: pointer;
        outline: 0;
        transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }
      button:hover, button:focus-visible {
        border-color: rgba(125, 211, 252, 0.62);
        background: linear-gradient(180deg, rgba(125, 211, 252, 0.28), rgba(14, 165, 233, 0.14));
        box-shadow: 0 0 0 1px rgba(125, 211, 252, 0.18), 0 14px 34px rgba(14, 165, 233, 0.24);
      }
      button:active {
        background: linear-gradient(180deg, rgba(14, 165, 233, 0.36), rgba(37, 99, 235, 0.18));
        border-color: rgba(186, 230, 253, 0.7);
      }
      .left-anchored button { border-left: 0; border-radius: 0 14px 14px 0; }
      .right-anchored button { border-right: 0; border-radius: 14px 0 0 14px; }
    </style>
  </head>
  <body class="left-anchored">
    <button id="open-dock" type="button" title="Open Comms Hub dock" aria-label="Open Comms Hub dock"></button>
    <script src="trigger-page.js"></script>
  </body>
</html>
